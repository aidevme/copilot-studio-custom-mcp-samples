name: MCP contract test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start the MCP server
        run: |
          dotnet run --project dotnet-mcp-server/src/Contoso.OrdersMcp --urls http://localhost:5080 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5080/mcp && break; sleep 2; done
      - name: Check the tool contract
        shell: pwsh
        run: ./tests/contract/Test-McpToolContract.ps1 -Endpoint http://localhost:5080/mcp
