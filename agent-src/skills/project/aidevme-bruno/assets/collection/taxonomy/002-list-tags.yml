info:
  name: List tags
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/wp-json/wp/v2/tags?per_page=100&orderby=count&order=desc&_fields=id,name,slug,count,description,link"
  params:
    - name: per_page
      value: "100"
      type: query
    - name: orderby
      value: count
      type: query
    - name: order
      value: desc
      type: query
    - name: _fields
      value: id,name,slug,count,description,link
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns tags, most used first", function () {
          const body = res.getBody();
          expect(body).to.be.an("array");
          for (let i = 1; i < body.length; i++) {
            expect(body[i - 1].count).to.be.at.least(body[i].count);
          }
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Tags (the product index), most used first, with count, description and link. First page only; for a full
  audit use aidevme-blog-tags.

  Auth: none. Expected: 200 with an array of tags sorted by count.
