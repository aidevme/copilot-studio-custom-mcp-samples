info:
  name: Search posts
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/wp-json/wp/v2/posts?search={{searchTerm}}&per_page=10&_fields=id,slug,link,title"
  params:
    - name: search
      value: "{{searchTerm}}"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: _fields
      value: id,slug,link,title
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns an array", function () {
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Published posts matching searchTerm (WordPress full-text search over title, excerpt and content).
  Useful before writing a post, to find what aidevme.com already covers.

  Auth: none. Expected: 200 with an array, possibly empty.
